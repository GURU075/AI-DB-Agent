spring.application.name=AI-Assisted-Database-Agent
server.port=${SERVER_PORT:8083}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Provider secrets must be supplied by the environment or a secret manager.
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_MODEL:openai/gpt-oss-20b}
spring.ai.openai.chat.options.temperature=0.0

# Per-session DataSources are created dynamically by ConnectionService.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Application safety limits.
app.session.ttl=${DB_AGENT_SESSION_TTL:PT30M}
app.operation.ttl=${DB_AGENT_OPERATION_TTL:PT10M}
app.sql.query-timeout-seconds=${DB_AGENT_QUERY_TIMEOUT_SECONDS:30}
app.connection.allowed-hosts=${DB_AGENT_ALLOWED_HOSTS:localhost,127.0.0.1,::1}

# Only expose non-sensitive operational endpoints.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Avoid logging prompts, SQL text, database errors, or provider payloads by default.
logging.level.com.guru=INFO
logging.level.org.springframework.ai=INFO
server.error.include-message=never
server.error.include-stacktrace=never
