services:
  app:
    build:
      context: .
    image: ai-database-agent:local
    environment:
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:?Set SPRING_AI_OPENAI_API_KEY}
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:-https://integrate.api.nvidia.com}
      SPRING_AI_OPENAI_MODEL: ${SPRING_AI_OPENAI_MODEL:-meta/llama-4-maverick-17b-128e-instruct}
      DB_AGENT_ALLOWED_HOSTS: ${DB_AGENT_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      DB_AGENT_SESSION_TTL: ${DB_AGENT_SESSION_TTL:-PT30M}
      DB_AGENT_OPERATION_TTL: ${DB_AGENT_OPERATION_TTL:-PT10M}
      DB_AGENT_QUERY_TIMEOUT_SECONDS: ${DB_AGENT_QUERY_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8083}:8083"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

